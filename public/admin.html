<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    :root {
      --bg: #12141c;
      --surface: #1a1d29;
      --border: #2c303e;
      --text: #edeef2;
      --accent: #e3a008;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --danger: #e63946;
      --success: #22c55e;
    }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 25px; margin: 0; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    
    .btn { background: var(--accent); color: #14161c; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 6px; text-decoration: none; display: inline-block; font-size: 14px; }
    .btn-logout { background: var(--danger); color: white; }
    .btn-login { background: var(--accent-blue); color: white; }
    .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-delete:hover { opacity: 0.85; }

    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8b8fa3; background: var(--surface); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

    /* Stats Grid */
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 25px; }
    .stat-card { background: var(--surface); padding: 18px; border-radius: 8px; border: 1px solid var(--border); }
    .stat-card h4 { margin: 0; font-size: 13px; color: #8b8fa3; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .count { font-size: 28px; font-weight: bold; margin-top: 8px; color: #fff; }
    .stat-card.total { border-left: 4px solid var(--accent); }
    .stat-card.code { border-left: 4px solid var(--accent-blue); }
    .stat-card.rd { border-left: 4px solid var(--accent-purple); }

    /* Search Bar */
    .filter-bar { margin-bottom: 15px; }
    .search-input { width: 100%; max-width: 350px; padding: 10px; background: var(--surface); border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none; }
    .search-input:focus { border-color: var(--accent); }

    /* Table Styles */
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    th, td { border-bottom: 1px solid var(--border); padding: 12px 14px; text-align: left; vertical-align: middle; }
    th { background: #151824; color: #8b8fa3; font-size: 13px; }
    tr:hover { background: #202330; }
    .reason-cell { max-width: 250px; font-size: 13px; color: #ccc; word-wrap: break-word; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-code { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-rd { background: rgba(139, 92, 246, 0.2); color: #c084fc; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h2>Student Registrations Admin View</h2>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="authStatusText">Logged in as Administrator</span>
    </div>
  </div>
  
  <div class="header-actions">
    <a href="/api/export" class="btn">Download Excel Sheet (.xlsx)</a>
    <div id="authBtnContainer">
      <a href="/logout" class="btn btn-logout">Logout</a>
    </div>
  </div>
</div>

<!-- Dynamic Summary Cards -->
<div class="stats-container">
  <div class="stat-card total">
    <h4>Total Applications</h4>
    <div class="count" id="totalCount">0</div>
  </div>
  <div class="stat-card code">
    <h4>Code Club</h4>
    <div class="count" id="codeCount">0</div>
  </div>
  <div class="stat-card rd">
    <h4>R&D Club</h4>
    <div class="count" id="rdCount">0</div>
  </div>
</div>

<div class="filter-bar">
  <input type="text" id="searchInput" class="search-input" placeholder="Search by name, reg number, or club...">
</div>

<table>
  <thead>
    <tr>
      <th>S.No</th>
      <th>Reg. No.</th>
      <th>Name</th>
      <th>Mobile / Email</th>
      <th>Dept / Yr</th>
      <th>Club</th>
      <th>Position</th>
      <th>Reason / Statement</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  let rawData = [];

  async function checkAuthAndLoadData() {
    try {
      const authRes = await fetch('/api/auth-status');
      const authData = await authRes.json();
      const btnContainer = document.getElementById('authBtnContainer');
      const statusText = document.getElementById('authStatusText');

      if (!authData.isAuthenticated) {
        // If session expired or logged out, redirect straight to login
        window.location.href = '/login';
        return;
      } else {
        btnContainer.innerHTML = '<a href="/logout" class="btn btn-logout">Logout</a>';
        statusText.innerText = 'Authenticated Admin';
      }

      const res = await fetch('/api/students');
      if (res.status === 401) {
        window.location.href = '/login';
        return;
      }
      rawData = await res.json();
      
      updateStats(rawData);
      renderTable(rawData);
    } catch (err) {
      console.error("Failed to fetch data:", err);
    }
  }

  function updateStats(data) {
    document.getElementById('totalCount').innerText = data.length;
    
    const codeClubCount = data.filter(r => r.club === 'Code Club').length;
    const rdClubCount = data.filter(r => r.club === 'R&D Club').length;
    
    document.getElementById('codeCount').innerText = codeClubCount;
    document.getElementById('rdCount').innerText = rdClubCount;
  }

  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 20px; color: #8b8fa3;">No registrations found.</td></tr>';
      return;
    }

    tbody.innerHTML = data.map((r, index) => {
      const clubBadgeClass = r.club === 'Code Club' ? 'badge-code' : 'badge-rd';
      return `
        <tr>
          <td><strong>${index + 1}</strong></td>
          <td>${r.regNumber}</td>
          <td>${r.fullName}</td>
          <td>${r.mobile}<br><small style="color:#8b8fa3;">${r.email}</small></td>
          <td>${r.department} / ${r.year}</td>
          <td><span class="badge ${clubBadgeClass}">${r.club}</span></td>
          <td>${r.position}</td>
          <td class="reason-cell">${r.reason || 'N/A'}</td>
          <td>
            <button class="btn-delete" onclick="deleteEntry('${r.id}')">Delete</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // Live Search Filtering
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = rawData.filter(r => 
      r.fullName.toLowerCase().includes(term) ||
      r.regNumber.toLowerCase().includes(term) ||
      r.club.toLowerCase().includes(term) ||
      r.position.toLowerCase().includes(term)
    );
    renderTable(filtered);
  });

  async function deleteEntry(id) {
    if (confirm("Are you sure you want to delete this record?")) {
      const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
      if (res.ok) {
        checkAuthAndLoadData();
      } else {
        alert("Failed to delete record.");
      }
    }
  }

  checkAuthAndLoadData();
</script>
</body>
</html>
