<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Club Registration</title>
  <style>
    :root {
      --bg: #12141c;
      --surface: #1a1d29;
      --surface-2: #20232f;
      --border: #2c303e;
      --text: #edeef2;
      --accent: #e3a008;
      --accent-blue: #3b82f6;
      --success: #22c55e;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; min-height: 100vh; }
    
    .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 12px 24px; border-radius: 8px; border: 1px solid var(--border); max-width: 600px; margin: 0 auto 20px auto; }
    .nav-title { font-weight: bold; font-size: 16px; }
    .btn-login { background: var(--accent); color: #12141c; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13.5px; }

    .container { max-width: 600px; margin: 0 auto; background: var(--surface); padding: 30px; border-radius: 8px; border: 1px solid var(--border); }
    h2 { margin-top: 0; text-align: center; margin-bottom: 20px; }

    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13.5px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 11px; background: var(--surface-2); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    button[type="submit"] { width: 100%; padding: 12px; background: var(--accent); color: #12141c; border: none; font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 6px; margin-top: 10px; }

    /* Google Forms Style "Already Responded" Card */
    .locked-card { display: none; text-align: center; padding: 40px 20px; }
    .locked-card .icon { font-size: 48px; color: var(--success); margin-bottom: 15px; }
    .locked-card h3 { font-size: 22px; margin-bottom: 10px; }
    .locked-card p { color: #8b8fa3; font-size: 14.5px; line-height: 1.5; margin-bottom: 20px; }
    .locked-card .sub-text { font-size: 12px; color: #606476; margin-top: 20px; }
  </style>
</head>
<body>



<div class="container">
  
  <!-- REGISTRATION FORM -->
  <div id="formContainer">
    <h2>Club Registration Form</h2>
    <form id="registerForm">
      <div class="field">
        <label>Register Number</label>
        <input type="text" id="regNumber" required placeholder="e.g. 21CS045">
      </div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="fullName" required placeholder="Enter your full name">
      </div>
      <div class="field">
        <label>Mobile Number</label>
        <input type="tel" id="mobile" required placeholder="Enter mobile number">
      </div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="Enter email">
      </div>
      <div class="field">
        <label>Department</label>
        <input type="text" id="department" required placeholder="e.g. CSE, ECE, MECH">
      </div>
      <div class="field">
        <label>Year</label>
        <select id="year" required>
          <option value="">Select Year</option>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
        </select>
      </div>
      <div class="field">
        <label>Club</label>
        <select id="club" required>
          <option value="">Select Club</option>
          <option value="Code Club">Code Club</option>
          <option value="R&D Club">R&D Club</option>
        </select>
      </div>
      <div class="field">
        <label>Position Preference</label>
        <input type="text" id="position" required placeholder="e.g. Member, Lead, Core Team">
      </div>
      <div class="field">
        <label>Reason for Joining</label>
        <textarea id="reason" rows="3" placeholder="Why do you want to join this club?"></textarea>
      </div>

      <button type="submit" id="submitBtn">Submit Registration</button>
    </form>
  </div>

  <!-- LOCKED STATE CARD (Shown after submission) -->
  <div id="lockedContainer" class="locked-card">
    <div class="icon">✓</div>
    <h3>You have already submitted your application</h3>
    <p>You can only fill in this form once. Contact your faculty advisor or club admin if you need to edit your submission.</p>
    <div class="sub-text">Submitted via College Club Registration Portal</div>
  </div>

</div>

<script>
  const formContainer = document.getElementById('formContainer');
  const lockedContainer = document.getElementById('lockedContainer');
  const registerForm = document.getElementById('registerForm');

  // Check on Page Load if user has already submitted
  function checkSubmissionStatus() {
    const isSubmitted = localStorage.getItem('club_form_submitted');
    if (isSubmitted === 'true') {
      formContainer.style.display = 'none';
      lockedContainer.style.display = 'block';
    }
  }

  // Handle Form Submission
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = 'Submitting...';

    const payload = {
      regNumber: document.getElementById('regNumber').value.trim(),
      fullName: document.getElementById('fullName').value.trim(),
      mobile: document.getElementById('mobile').value.trim(),
      email: document.getElementById('email').value.trim(),
      department: document.getElementById('department').value.trim(),
      year: document.getElementById('year').value,
      club: document.getElementById('club').value,
      position: document.getElementById('position').value.trim(),
      reason: document.getElementById('reason').value.trim()
    };

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        // Save submission flag to browser localStorage
        localStorage.setItem('club_form_submitted', 'true');
        
        // Lock the page immediately
        formContainer.style.display = 'none';
        lockedContainer.style.display = 'block';
      } else {
        alert("Failed to submit registration. Please try again.");
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Registration';
      }
    } catch (err) {
      alert("Network error. Please check your connection.");
      submitBtn.disabled = false;
      submitBtn.innerText = 'Submit Registration';
    }
  });

  // Run initial check when page opens
  checkSubmissionStatus();
</script>

</body>
</html>
