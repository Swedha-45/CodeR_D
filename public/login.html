<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    :root {
      --bg: #12141c;
      --surface: #1a1d29;
      --surface-2: #20232f;
      --border: #2c303e;
      --text: #edeef2;
      --accent: #e3a008;
      --error: #ff4d4d;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-card { width: 100%; max-width: 380px; background: var(--surface); padding: 30px; border-radius: 8px; border: 1px solid var(--border); }
    h2 { margin-top: 0; font-size: 22px; text-align: center; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13.5px; font-weight: 600; }
    
    /* Input Wrapper for Password Field & Eye Icon */
    .input-wrapper { position: relative; display: flex; align-items: center; }
    input { width: 100%; padding: 11px 12px; background: var(--surface-2); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    .input-wrapper input { padding-right: 40px; } /* Space for eye button */
    
    input:focus { border-color: var(--accent); }
    
    /* Toggle Visibility Button Style */
    .toggle-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: #8b8fa3;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-btn:hover { color: var(--accent); }
    .toggle-btn svg { width: 18px; height: 18px; fill: currentColor; }

    button[type="submit"] { width: 100%; padding: 12px; background: var(--accent); color: #12141c; border: none; font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 6px; margin-top: 10px; }
    .err-alert { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--error); color: var(--error); padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Faculty Admin Login</h2>
  <div id="errBox" class="err-alert">Invalid username or password</div>
  
  <form id="loginForm">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" required placeholder="Enter admin username">
    </div>
    
    <div class="field">
      <label>Password</label>
      <div class="input-wrapper">
        <input type="password" id="password" required placeholder="Enter password">
        <button type="button" class="toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
          <!-- Eye Icon (Closed Eye / Hide by default) -->
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit">Log In</button>
  </form>
</div>

<script>
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePassword');
  const eyeIcon = document.getElementById('eyeIcon');

  // Eye Icon Paths
  const eyeOpenPath = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
  const eyeClosedPath = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z";

  // Password Visibility Toggle Logic
  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.querySelector('path').setAttribute('d', isPassword ? eyeClosedPath : eyeOpenPath);
  });

  // Login Handler
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = passwordInput.value.trim();
    const errBox = document.getElementById('errBox');

    errBox.style.display = 'none';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        window.location.href = '/admin';
      } else {
        errBox.style.display = 'block';
      }
    } catch (err) {
      alert("Network connection error.");
    }
  });
</script>
</body>
</html>
