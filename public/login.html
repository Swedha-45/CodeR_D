<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    :root {
      --bg: #12141c;
      --surface: #1a1d29;
      --surface-2: #20232f;
      --border: #2c303e;
      --text: #edeef2;
      --accent: #e3a008;
      --error: #ff4d4d;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-card { width: 100%; max-width: 380px; background: var(--surface); padding: 30px; border-radius: 8px; border: 1px solid var(--border); }
    h2 { margin-top: 0; font-size: 22px; text-align: center; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 13.5px; font-weight: 600; }
    input { width: 100%; padding: 11px 12px; background: var(--surface-2); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; padding: 12px; background: var(--accent); color: #12141c; border: none; font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 6px; margin-top: 10px; }
    .err-alert { background: rgba(255, 77, 77, 0.1); border: 1px solid var(--error); color: var(--error); padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>

<div class="login-card">
  <h2>Faculty Admin Login</h2>
  <div id="errBox" class="err-alert">Invalid username or password</div>
  
  <form id="loginForm">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" required placeholder="Enter admin username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required placeholder="Enter password">
    </div>
    <button type="submit">Log In</button>
  </form>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errBox = document.getElementById('errBox');

    errBox.style.display = 'none';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        // Redirect to admin page upon successful authentication
        window.location.href = '/admin';
      } else {
        errBox.style.display = 'block';
      }
    } catch (err) {
      alert("Network connection error.");
    }
  });
</script>
</body>
</html>
